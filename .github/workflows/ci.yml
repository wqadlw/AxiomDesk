name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    name: Lint / Format / Type / Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install quality tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy bandit
      - name: Ruff lint
        run: ruff check server tests
      - name: Ruff format check
        run: ruff format --check server tests
      - name: Mypy type check
        run: mypy server
      - name: Bandit security scan
        run: bandit -r server -c .bandit -q

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project (editable, with dev deps)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests with coverage
        run: pytest --cov=server --cov-report=term-missing
      - name: Coverage gate (>=70%)
        run: |
          pytest --cov=server --cov-report= | tail -1 | awk -F'|' '/TOTAL/{gsub(/ /,"",$4); if ($4+0 < 70) {print "Coverage too low:", $4"%"; exit 1}}'

  frontend:
    name: Frontend syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax check frontend
        run: node --check web/app.js
