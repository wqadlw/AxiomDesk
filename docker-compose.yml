services:
  axiomdesk:
    build: .
    image: axiomdesk:latest
    container_name: axiomdesk
    ports:
      - "8137:8137"
    environment:
      AXIOM_HOST: "0.0.0.0"
      AXIOM_PORT: "8137"
      AXIOM_DATA_SOURCE: "auto"
      AXIOM_LOG_LEVEL: "INFO"
      # 可选：配置 DeepSeek 启用 AI 研判层
      # AXIOM_DEEPSEEK_API_KEY: "${AXIOM_DEEPSEEK_API_KEY:-}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8137/api/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - axiom-data:/app/.data

volumes:
  axiom-data:
