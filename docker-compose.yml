services:
  uzi-terminal:
    build: .
    image: uzi-terminal:latest
    container_name: uzi-terminal
    ports:
      - "8137:8137"
    environment:
      UZI_HOST: "0.0.0.0"
      UZI_PORT: "8137"
      UZI_DATA_SOURCE: "auto"
      UZI_LOG_LEVEL: "INFO"
      # 可选：配置 DeepSeek 启用 AI 研判层
      # UZI_DEEPSEEK_API_KEY: "${UZI_DEEPSEEK_API_KEY:-}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8137/api/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - uzi-data:/app/.data

volumes:
  uzi-data:
